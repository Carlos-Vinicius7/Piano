<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/Piano.css">
    <title>Piano</title>
</head>

<body>
    <section class="Piano">

        <section class="Controls">

            <h1>PIANO</h1>

            <label class="checkbox-label">
                Show keys
                <span class="switcher">
                    <span class="switcher-button"></span>
                </span>
                <input type="checkbox" class="checkbox-keys" hidden>
            </label>
        </section>

        <section class="Piano-keys">
            <div class="key white" data-notes="1"><span>TAB</span></div>
            <div class="key black" data-notes="2"><span>1</span></div>
            <div class="key white" data-notes="3"><span>q</span></div>
            <div class="key black" data-notes="4"><span>2</span></div>
            <div class="key white" data-notes="5"><span>w</span></div>
            <div class="key white" data-notes="6"><span>e</span></div>
            <div class="key black" data-notes="7"><span>3</span></div>
            <div class="key white" data-notes="8"><span>r</span></div>
            <div class="key black" data-notes="9"><span>4</span></div>
            <div class="key white" data-notes="10"><span>t</span></div>
            <div class="key black" data-notes="11"><span>5</span></div>
            <div class="key white" data-notes="12"><span>y</span></div>
            <div class="key white" data-notes="13"><span>u</span></div>
            <div class="key black" data-notes="14"><span>6</span></div>
            <div class="key white" data-notes="15"><span>i</span></div>
            <div class="key black" data-notes="16"><span>7</span></div>
            <div class="key white" data-notes="17"><span>o</span></div>
            <div class="key white" data-notes="18"><span>p</span></div>
            <div class="key black" data-notes="19"><span>8</span></div>
            <div class="key white" data-notes="20"><span>[</span></div>
            <div class="key black" data-notes="21"><span>9</span></div>
            <div class="key white" data-notes="22"><span>]</span></div>
            <div class="key black" data-notes="23"><span>0</span></div>
            <div class="key white" data-notes="24"><span>-</span></div>
        </section>

    </section>

    <script src="JavaScript/Piano.js"></script>
</body>

</html>
